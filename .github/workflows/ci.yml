name: CI

on:
  pull_request:
  push:
    branches: [main]

# Reset the default token scope, then grant per job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # to check out the repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 24 ships npm 11.x. Kept in sync with release.yml so a green CI run
      # means the release job will behave the same.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.15.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Each package builds dist/ first, then tests the published output.
      - run: pnpm test
